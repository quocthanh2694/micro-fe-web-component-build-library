<h2>Angular Demo Input Web Component</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <pj1-input ngDefaultControl formControlName="name" id="name"
      [attr.error]="(form.controls.name.invalid && (form.controls.name.dirty || form.controls.name.touched)) ? 'Required' : ''" />
    <!-- <div class="error"
      *ngIf="form.controls.name.invalid && (form.controls.name.dirty || form.controls.name.touched)">
      Required</div> -->
  </div>
  <br>
  <button class="button" type="submit" [disabled]="form.invalid">Submit form</button>
</form>
